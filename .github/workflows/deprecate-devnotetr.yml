name: Deprecate legacy package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Deprecate devnotetr
        run: npm deprecate "devnotetr@*" "Renamed to @burakboduroglu/penote"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
