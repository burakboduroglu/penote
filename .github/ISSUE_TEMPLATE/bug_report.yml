name: Bug report
description: Something in the notes, CLI, or Web UI is broken or unexpected
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this form for security
        issues — see [SECURITY.md](https://github.com/burakboduroglu/penote/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and what you expected instead.
      placeholder: |
        `penote search hibernate` returns nothing even though
        Java-Notes/jpa_hibernate.md exists…
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or steps to reproduce
      description: CLI command and output, or clicks in the Web UI / TUI.
      render: shell
      placeholder: |
        $ bun library/cli.js search hibernate
        …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package / repo version
      description: npm version (`npm view @burakboduroglu/penote version`) or git commit.
      placeholder: 2.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 on Apple silicon, or Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running it?
      options:
        - npm global install (@burakboduroglu/penote)
        - Clone / from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - CLI
        - TUI
        - Web UI
        - Note content
        - More than one
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Related note paths, screenshots descriptions, or prior issues.
